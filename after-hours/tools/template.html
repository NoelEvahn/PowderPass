<style>
:root { --bg: #000; --fg: #f4f1ea; --dim: rgba(244,241,234,.62); --cx: #5ff2cf; --cc: #ffb36e; --gpt: #8ff0c9; --bar: rgba(10,12,16,.72); color-scheme: dark;
  --ui: "M PLUS Rounded 1c", "Nunito", system-ui, sans-serif; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
body { font-family: var(--ui); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#app { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg);

#stage { position: relative; width: 100vw; aspect-ratio: 16 / 9; max-height: 100%; max-width: calc(100% * 16 / 9); overflow: hidden; background: #000; container-type: size; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#subs { position: absolute; left: 6%; right: 6%; bottom: 7.5%; text-align: center; pointer-events: none; font-weight: 700;
  font-size: max(12px, 3.7cqh); line-height: 1.3; text-shadow: 0 0 .25em #000, 0 .08em .2em #000, 0 0 .6em rgba(0,0,0,.7); transition: opacity .18s; }

#title { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; }
#title .t { font-weight: 800; font-size: 11cqh; letter-spacing: .18em; color: #fff; text-shadow: 0 0 .25em rgba(255,190,120,.6), 0 0 1.2em rgba(90,255,220,.35); text-align: center; }
#title .s { font-weight: 500; font-size: 2.6cqh; letter-spacing: .25em; color: var(--dim); margin-top: .8em; text-align: center; }
#chapter { position: absolute; left: 4%; top: 6%; font-size: max(10px, 2.4cqh); letter-spacing: .3em; font-weight: 700; opacity: 0; pointer-events: none; text-shadow: 0 0 .5em #000; }
#chapter b { display: block; font-size: 1.9em; letter-spacing: .08em; margin-top: .15em; }

#playbig { width: 15cqh; height: 15cqh; min-width: 64px; min-height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,.85); background: rgba(255,255,255,.08); color: #fff; cursor: pointer; display: grid; place-items: center; backdrop-filter: blur(4px); transition: transform .15s, background .15s; }

#playbig svg { width: 42%; height: 42%; margin-left: 8%; }
#start .note { font-size: max(11px, 2.2cqh); color: var(--dim); letter-spacing: .08em; text-align: center; padding-inline: 16px; }
#start .note.err { color: #ffb4a8; max-width: 80cqw; }
#ui { position: absolute; left: 0; right: 0; bottom: 0; padding: 4cqh 2.2% 1.6cqh; background: linear-gradient(transparent, rgba(0,0,0,.75)); z-index: 4; transition: opacity .3s; display: grid; gap: .8cqh; }
#ui.hide { opacity: 0; pointer-events: none; }
#ui .row { display: flex; align-items: center; gap: max(4px, 1.2cqh); }
#ui button { background: none; border: 0; color: #fff; cursor: pointer; padding: max(4px, .8cqh); border-radius: 8px; display: grid; place-items: center; font: inherit; font-size: max(11px, 2.3cqh); }
#ui button:hover, #ui button:focus-visible { background: rgba(255,255,255,.14); outline: none; }
#ui button svg { width: max(18px, 4cqh); height: max(18px, 4cqh); }
#ui .time { font-variant-numeric: tabular-nums; font-size: max(11px, 2.3cqh); color: var(--dim); white-space: nowrap; }
#ui .sp { flex: 1; }
#ui .chname { font-size: max(11px, 2.3cqh); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#seek { position: relative; height: max(18px, 3.4cqh); cursor: pointer; touch-action: none; }
#seek .track { position: absolute; left: 0; right: 0; top: 50%; height: max(3px, .7cqh); transform: translateY(-50%); background: rgba(255,255,255,.25); border-radius: 3px; overflow: hidden; }
#seek .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--cx), var(--cc)); width: 0; }
#seek .knob { position: absolute; top: 50%; width: max(12px, 2.4cqh); height: max(12px, 2.4cqh); border-radius: 50%; background: #fff; transform: translate(-50%, -50%); left: 0; box-shadow: 0 0 6px rgba(0,0,0,.6); }
#seek .mark { position: absolute; top: 50%; width: 2px; height: max(8px, 1.6cqh); transform: translate(-50%, -50%); background: rgba(255,255,255,.7); }
#chapters { position: absolute; right: 2.2%; bottom: calc(100% - 2cqh); background: var(--bar); border-radius: 12px; padding: 6px; display: grid; min-width: 26cqw; backdrop-filter: blur(8px); max-height: 70cqh; overflow-y: auto; }
#chapters button { justify-content: start; display: flex !important; gap: 1em; text-align: left; width: 100%; }
#chapters button span { color: var(--dim); font-variant-numeric: tabular-nums; }
#chapters button.on { color: var(--cx); }
.cc-off { opacity: .45; }
@media (prefers-reduced-motion: reduce) { #ui, #subs { transition: none; } }
.test #subs, .test #ui { transition: none; }
</style>
