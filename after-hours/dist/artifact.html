function blinkAmount(t, seed) {
  const period = 3.1 + seed;
  const k = Math.floor(t / period);
  const tt = t - k * period - hash1(k + seed * 17) * 1.2;
  if (tt > 0 && tt < 0.16) return Math.sin((tt / 0.16) * Math.PI);
  return 0;
}

function drawClaudeFace(R, t) {

  } else if (mood === 'sleepy' || open < 0.12) {
    c.lineWidth = 9;

    c.globalAlpha = 1;

    roundEye(cx1, cy + 6, r, open * 0.75, 18); roundEye(cx2, cy + 6, r, open * 0.75, -18);

  } else if (f.yawn) { c.beginPath(); c.ellipse(mx, my + 2, 16, 8 + f.yawn * 14, 0, 0, TAU); c.fill(); }
  else if (mood === 'happy' || mood === 'neutral' || mood === 'thinking') { c.beginPath(); c.arc(mx, my - 10, 14, Math.PI * 0.2, Math.PI * 0.8); c.stroke(); }
  else if (mood === 'surprised') { c.beginPath(); c.arc(mx, my, 8, 0, TAU); c.stroke(); }
  else if (mood === 'worried' || mood === 'error') { c.beginPath(); c.arc(mx, my + 10, 13, Math.PI * 1.2, Math.PI * 1.8); c.stroke(); }
  else if (mood !== 'sleepy') { c.beginPath(); c.moveTo(mx - 12, my); c.lineTo(mx + 12, my); c.stroke(); }

  c.restore();

}

function plankTex(base, dark, w = 512, h = 512, rows = 8, seed = 1) {

    const r = rng(seed);

    const rh = h / rows;
    for (let i = 0; i < rows; i++) {
      let x = -r() * 200;
      while (x < w) {
        const pw = 140 + r() * 180;
        const l = 0.88 + r() * 0.2;
        c.fillStyle = shade(base, l); c.fillRect(x, i * rh, pw, rh);
        c.strokeStyle = 'rgba(0,0,0,0.05)'; c.lineWidth = 1;
        for (let k = 0; k < 4; k++) { c.beginPath(); const yy = i * rh + r() * rh; c.moveTo(x, yy); c.bezierCurveTo(x + pw * 0.3, yy + 3, x + pw * 0.6, yy - 3, x + pw, yy); c.stroke(); }

}
function shade(hex, l) {

}

  }, repeat ? { repeat } : {});
}
function texMat(tex, opts = {}) { return new THREE.MeshToonMaterial(Object.assign({ map: tex, gradientMap: GRAD3 }, opts)); }

// sky/skyline canvas for window views
function skyTex(top, mid, bot, opts = {}) {

    c.fillStyle = g; c.fillRect(0, 0, w, h);

// wall with rectangular holes: holes = [[cx, cy, w, h]] in wall-local x (along width) / y
function wallWithHoles(parent, W, H, D, mat, holes, x, y, z, ry = 0) {
  const g = group(parent, x, y, z, ry);

function windowTex(base, lit, unlit, cols = 4, rows = 6, seed = 1, frame) {
  return canvasTex(256, 256, (c, w, h) => {
    const r = rng(seed);
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    const cw = w / cols, rh = h / rows;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {

      if (frame) { c.fillStyle = frame; c.fillRect(x * cw + cw * 0.49, y * rh + rh * 0.18, cw * 0.03, rh * 0.62); }
    }
  });
}

// ───────────────────────── story framework ─────────────────────────
// Everything on screen is a pure function of film time t (so seeking is exact).
function shot(t0, t1, env, seq, cam, grade = {}) { SHOTS.push({ t0, t1, env, seq, cam, grade }); }
function say(t, who, text, d) { LINES.push({ t, who, text, d: d ?? Math.max(1.6, text.length * 0.062) }); }
function sfx(t, name, opts = {}) { SFX.push({ t, name, opts }); }
function chapter(t, name) { CHAPTERS.push({ t, name }); }

// camera helpers
function camK(keys) {
  const tr = K(keys.map(([t, p, tg, fov, e]) => [t, { px: p[0], py: p[1], pz: p[2], tx: tg[0], ty: tg[1], tz: tg[2], fov: fov ?? 40 }, e || 'io']));
  return (t) => { const v = tr(t); return { p: [v.px, v.py, v.pz], t: [v.tx, v.ty, v.tz], fov: v.fov }; };
}
function withUp(cam, up) { return (t, lt) => Object.assign({}, cam(t, lt), { up }); }
function camStatic(p, tg, fov = 40) { return () => ({ p, t: tg, fov }); }
// follow a world point produced by fn(t) with an offset
function camFollow(fnTarget, off, fov = 40, lookOff = [0, 0, 0]) {
  return (t) => { const q = fnTarget(t); return { p: [q[0] + off[0], q[1] + off[1], q[2] + off[2]], t: [q[0] + lookOff[0], q[1] + lookOff[1], q[2] + lookOff[2]], fov }; };
}

const Story = (() => {

  const tmpV = new THREE.Vector3(), tmpT = new THREE.Vector3();
  let sceneRef;
  S.build = (scene) => {
    sceneRef = scene;
    for (const b of BUILDERS) b();
    for (const k in ENVS) scene.add(ENVS[k].group);
    A.cx = buildRobot('codex'); A.cc = buildRobot('claude'); A.gpt = buildGPT();
    for (const k of ['cx', 'cc', 'gpt']) { A[k].root.visible = false; scene.add(A[k].root); }
    SHOTS.sort((a, b) => a.t0 - b.t0);
    LINES.sort((a, b) => a.t - b.t);
    CHAPTERS.sort((a, b) => a.t - b.t);
    SFX.sort((a, b) => a.t - b.t);
    S.duration = SHOTS[SHOTS.length - 1].t1;
    if (typeof buildFX === 'function') buildFX(scene);
  };
  S.shotAt = (t) => { for (let i = SHOTS.length - 1; i >= 0; i--) if (t >= SHOTS[i].t0) return SHOTS[i]; return SHOTS[0]; };
  S.lineAt = (t) => { for (let i = LINES.length - 1; i >= 0; i--) { const l = LINES[i]; if (t >= l.t && t < l.t + l.d) return l; if (l.t + 20 < t) break; } return null; };
  S.talking = (who, t) => {
    for (let i = LINES.length - 1; i >= 0; i--) {
      const l = LINES[i]; if (l.who !== who) continue;
      if (t >= l.t && t < l.t + l.d - 0.35) { const u = t - l.t; return clamp(0.35 + 0.65 * Math.abs(Math.sin(u * 13 + Math.sin(u * 5) * 2))) * clamp(u * 8) ; }
      if (l.t + 20 < t) break;
    }
    return 0;
  };
  S.chapterAt = (t) => { let c = null; for (const ch of CHAPTERS) if (t >= ch.t - 0.001) c = ch; return c; };
  S.titleAt = (t) => { for (const tc of TITLES) if (t >= tc.t0 && t <= tc.t1) { const o = Math.min(sseg(t, tc.t0, tc.t0 + 1.0), 1 - sseg(t, tc.t1 - 0.8, tc.t1)); return { o, sub: tc.sub }; } return { o: 0 }; };
  S.chapterCard = (t) => {
    for (let i = 0; i < CHAPTERS.length; i++) {
      const ch = CHAPTERS[i]; if (!ch.card) continue;

    }
    return { o: 0 };
  };

      for (const k in ENVS) ENVS[k].group.visible = ENVS[k] === env;

    }

    const c = sh.cam(t, t - sh.t0);
    tmpV.set(c.p[0], c.p[1], c.p[2]).add(env.group.position);
    tmpT.set(c.t[0], c.t[1], c.t[2]).add(env.group.position);

    if (g.sat !== undefined) info.sat = g.sat;
    if (g.vig !== undefined) info.vig = g.vig;
    lastShot = sh;
    return info;
  };

})();

function travelTable(track, t0, t1) {
  const N = Math.ceil((t1 - t0) * 240), d = new Float32Array(N + 1); let px = track(t0).x, pz = track(t0).z;

  return (t) => d[clamp(Math.round((t - t0) * 240), 0, N)];

// ───────────────────────── audio: procedural score + synthesized sound design ─────────────────────────
// Every sound is an event at a film time. On play/seek a fresh "session" bus is created and events are
// scheduled ahead of the film clock (which *is* the AudioContext clock), so picture and sound stay locked.
const NOTE = (() => { const m = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }; return (n) => { const r = /^([A-G])(#|b)?(-?\d)$/.exec(n); let s = m[r[1]] + (r[2] === '#' ? 1 : r[2] === 'b' ? -1 : 0) + (+r[3] + 1) * 12; return 440 * Math.pow(2, (s - 69) / 12); }; })();
