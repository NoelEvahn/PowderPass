# Self-hosted setup: the website, a PostgreSQL database and a folder for uploaded photos.
# 1. cp .env.example .env and fill it in (DATABASE_URL below is set for you).
# 2. docker compose up -d --build
# 3. Open https://your-domain/admin and create the first administrator.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      DATABASE_URL: postgres://labeltrunc:${POSTGRES_PASSWORD:-change-me}@db:5432/labeltrunc
      MEDIA_DIR: /app/media
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: labeltrunc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: labeltrunc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U labeltrunc']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  media:
