# ============================================================================
#  PowderPass - realistic volleyball for Paper 1.21.11
#  All distances are in blocks (1 block = 1 metre), speeds in metres/second.
#  Run /vb reload after editing.
# ============================================================================

config-version: 2

# Optional chat prefix (MiniMessage), empty for none.
prefix: ""

# Set true when players use the PowderPass resource pack: the plugin then plays its custom sounds.
# (The pack's 3D ball shows automatically for players who have it.)
custom-sounds: false

ball:
  # Player-head skin of the ball (players without the resource pack see this head).
  texture: "https://textures.minecraft.net/texture/1e6df1c2bf5b918f6c8879af4c4ecc1dabbe37229284e1f8f6bccdb1ea3d0ac"
  # Rendered size in blocks (a real ball is 0.21 m).
  visual-size: 0.45
  # Client smoothing in ticks for movement / spin.
  teleport-interpolation: 2
  rotation-interpolation: 2
  shadow: true
  trail: true
  # Seconds before an untouched practice ball despawns.
  idle-despawn-seconds: 45
  max-practice-balls: 2

physics:
  gravity: 9.81
  air-density: 1.2
  radius: 0.105
  mass: 0.27
  # Drag coefficient below / above the drag crisis (smooth balls lose drag at speed).
  drag-coefficient-slow: 0.47
  drag-coefficient-fast: 0.22
  drag-crisis-speed: 17.0
  drag-crisis-width: 1.6
  # Magnus lift: C_L = lift-slope * (r * omega / v), capped.
  lift-slope: 1.0
  max-lift-coefficient: 0.35
  spin-decay-seconds: 4.0
  # Float serve wobble (0 disables).
  knuckle-strength: 1.0
  knuckle-spin-threshold: 2.5
  floor-restitution: 0.70
  floor-friction: 0.45
  wall-restitution: 0.55
  wall-friction: 0.35
  net-restitution: 0.12
  net-tangential-damping: 0.55
  tape-restitution: 0.35
  antenna-restitution: 0.45
  rolling-resistance: 0.6
  rest-speed: 0.08
  max-substeps: 32

controls:
  # Ticks a click stays "armed" waiting for the ball to reach your hands (input buffering).
  input-buffer-ticks: 8
  # Rewind the ball by the player's ping when judging contact (lag compensation).
  lag-compensation: true
  max-compensation-ms: 250
  # Ticks before the same player can hit again.
  hit-cooldown-ticks: 6
  # Extra jump velocity (blocks/tick) for a sprinting approach jump inside the attack zone. 0 disables.
  approach-jump-boost: 0.10
  # Forward lunge (blocks/tick) when diving for a dig.
  dive-lunge: 0.55
  # Show a landing-target marker while aiming.
  aim-reticle: true

# Per-action tuning. 'reach' is the radius around the ideal contact point.
# Aim: the landing distance is chosen with your view pitch, from 'near' (looking down at pitch-near)
# to 'far' (looking up at pitch-far). Looking far above the horizon ("at the ball") uses 'look-up'.
hits:
  bump:
    reach: 1.70
    apex: 2.4
    max-error: 1.4
    aim: { near: 1.5, far: 9.0, pitch-near: 60, pitch-far: -25, look-up: 4.5 }
  dig:
    reach: 2.10
    apex: 2.8
    max-error: 2.0
    aim: { near: 1.5, far: 8.0, pitch-near: 60, pitch-far: -25, look-up: 4.5 }
  set:
    reach: 1.50
    apex: 3.0
    quick-apex: 1.2
    max-error: 1.0
    aim: { near: 1.0, far: 8.0, pitch-near: 60, pitch-far: -15, look-up: 4.0 }
  spike:
    reach: 1.45
    min-speed: 15.0
    max-speed: 28.0
    min-topspin: 15.0
    max-topspin: 45.0
    max-error: 1.3
    aim: { near: 1.5, far: 11.0, pitch-near: 70, pitch-far: -10, look-up: 9.0 }
  tip:
    reach: 1.50
    apex: 0.8
    max-error: 0.8
    aim: { near: 1.0, far: 6.0, pitch-near: 60, pitch-far: -20, look-up: 3.0 }
  block:
    duration-ticks: 12
    width: 1.3
    reach-over: 0.45
  serve:
    reach: 1.5
    float-min-speed: 13.5
    float-max-speed: 18.5
    topspin-min-speed: 15.0
    topspin-max-speed: 21.0
    jump-min-speed: 19.0
    jump-max-speed: 28.0
    jump-topspin: 42.0
    standing-topspin: 25.0
    underhand-apex: 4.0
    max-error: 1.6
    toss-speed: 6.0
    jump-toss-speed: 7.4
    jump-toss-forward: 1.6
    aim: { near: 10.0, far: 19.0, pitch-near: 35, pitch-far: -20, look-up: 16.0 }

# Defaults for new courts (/vb court create). Presets override these.
court-defaults:
  free-zone: 3.0
  net-band-height: 1.0
  antenna-above-net: 0.8
  post-offset: 0.75
  floor:
    court: ORANGE_TERRACOTTA
    free-zone: BLUE_TERRACOTTA
    beach-court: SAND
    beach-free-zone: SAND
  # net mesh resolution (more = finer netting, more display entities)
  net-columns: 12
  net-rows: 4
  # ticks of client interpolation for net animation
  net-interpolation: 2
  # Lines are display entities, so they never break and can be removed cleanly.
  line-material: WHITE_CONCRETE
  view-range: 1.5
  # Sittable team benches.
  furniture: true

# Default match settings. Every court can override them with /vb rules <court>.
match-defaults:
  sets-to-win: 2            # 1 = single set, 2 = best of 3, 3 = best of 5
  points-per-set: 25
  deciding-set-points: 15
  win-by: 2
  point-cap: 0              # 0 = no cap
  serve-time-seconds: 8
  rally-end-delay-seconds: 3
  switch-sides: true
  auto-position: true       # teleport players to their rotation spot before each serve
  rules:
    foot-fault: true
    net-touch: true
    center-line: true
    four-hits: true
    double-contact: true
    antenna: true
    reach-over: true
    back-row-attack: true   # only applies to 6v6
    serve-block: true
    serving-team-touch: true
    toss-drop: true
    ceiling-out: true
    serve-delay: true
    aim-assist: true

teams:
  a: { name: "Red", color: "#ff5555" }
  b: { name: "Blue", color: "#55aaff" }

# Optional sound overrides, e.g.
#   spike: { key: "minecraft:entity.player.attack.strong", volume: 1.6, pitch: 0.8 }
# Sound ids: bump dig set spike spike-perfect tip serve serve-jump block body floor sand wall net tape antenna
#            toss whistle whistle-long point cheer applause ooh win countdown go jump dive whiff
# Without overrides vanilla sounds are used, or the pack's sounds when custom-sounds is true.
sounds: {}

hud:
  sidebar: true
  hit-feedback: true        # short action bar after each touch
  sidebar-update-ticks: 5

performance:
  # Spawn trail particles only when the ball is faster than this (m/s).
  trail-min-speed: 9.0
  # Ball and net updates are sent to players within this many blocks.
  particle-range: 64
  # Log a breakdown when one volleyball tick takes longer than this (ms). 0 disables.
  log-slow-ticks-ms: 0
