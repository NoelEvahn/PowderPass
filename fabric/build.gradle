plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base { archivesName = 'powderpass' }
version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

repositories { mavenCentral() }

// The generation core is compiled into the mod jar (it has no Minecraft dependencies).
sourceSets.main.java.srcDir('../core/src/main/java')

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def v = project.version
    inputs.property 'version', v
    filesMatching('fabric.mod.json') { expand 'version': v }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar { from('../LICENSE') { rename { "${it}_powderpass" } } }

loom {
    runs {
        server {
            server()
            name 'PowderPass Server'
            runDir 'run/server'
        }
    }
}
