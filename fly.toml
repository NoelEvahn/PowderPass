# Fly.io: `fly launch --copy-config --no-deploy && fly volumes create doors_data --size 1 && fly deploy`
app = "doors-hotel"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  MAX_PLAYERS = "4"

[[mounts]]
  source = "doors_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "3s"
